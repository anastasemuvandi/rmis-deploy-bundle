# RMIS — system nginx site for the single-origin deploy on 10.10.73.8:80.
# Install as /etc/nginx/conf.d/rmis.conf, then `nginx -t && systemctl reload nginx`.
#
# Unlike IRMIS (native jar + files on disk), the RMIS frontend is a CONTAINER that
# runs its OWN internal nginx: it serves the Angular SPA and reverse-proxies /api/
# to the backend container. That container used to bind host :80 directly, but the
# shared system nginx owns :80 on this host — so the container now binds :8086 and
# this site reverse-proxies all of :80 -> 127.0.0.1:8086.
#
# The browser origin therefore stays http://10.10.73.8 (:80), which is what
# CORS_ORIGINS, FRONTEND_URL, and the Keycloak redirect_uri all expect — no app
# changes needed.
#
# NOTE: SSO is NOT proxied here. The SPA hits the backend's host port (:8085) and
# the wrapper (:8000) directly via absolute URLs (see environment.prod), so /oauth2
# and /login/oauth2 never pass through this site.
server {
    listen 80;
    server_name _;

    # Everything -> the rmis-frontend container's internal nginx (host port 8086).
    # That container handles /api/ proxying and Angular SPA routing itself.
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
